name: Branch Build

on:
  push:
    branches:
      - 'ci/build-batch-generation-progress-*'

permissions:
  contents: read

jobs:
  build:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: build:win
            platform: win32
            arch: x64
          - os: macos-latest
            script: build:mac
            platform: darwin
            arch: arm64
          - os: macos-15-intel
            script: build:mac
            platform: darwin
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: |
          node -e "if (process.arch !== '${{ matrix.arch }}') throw new Error('Unexpected runner architecture: ' + process.arch)"
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      # Both package scripts include typecheck. pnpm forwards these flags without an extra --.
      - run: pnpm run ${{ matrix.script }} --publish never
      - if: runner.os == 'macOS'
        run: node scripts/verify-macos-native-deps.mjs
      - run: node scripts/verify-packaged-app.mjs ${{ matrix.platform }} ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
            dist/*.dmg
          if-no-files-found: error
