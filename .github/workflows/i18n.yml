name: i18n

on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/i18n*.test.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'tsconfig*.json'
      - 'vitest.config.ts'
      - '.github/workflows/i18n.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/i18n*.test.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'tsconfig*.json'
      - 'vitest.config.ts'
      - '.github/workflows/i18n.yml'

permissions:
  contents: read

jobs:
  translations:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm i18n:check
      - run: pnpm run typecheck
