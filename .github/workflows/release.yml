name: Release

# Tags build a fully validated draft. Publishing remains a separate manual step.
# A manual run is a dry run: it builds and validates every platform without
# checking a tag or touching any release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: node scripts/verify-release.mjs version "$GITHUB_REF_NAME"
      - run: node scripts/verify-release.mjs draft "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    needs: validate
    # validate is skipped only on a manual dry run; a failed or cancelled check still blocks.
    if: ${{ !cancelled() && (needs.validate.result == 'success' || (github.event_name == 'workflow_dispatch' && needs.validate.result == 'skipped')) }}
    uses: ./.github/workflows/build.yml

  release:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - run: node scripts/verify-release.mjs assets all
      # Recheck immediately before uploading, including on a manually rerun job.
      - run: node scripts/verify-release.mjs draft "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: false
          fail_on_unmatched_files: true
          body_path: release-notes/${{ github.ref_name }}.md
          files: dist/*
